<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Public Radio — Countdown</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #3fb950;
      --highlight: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .terminal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .header h1 {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
    }
    .header a {
      color: var(--highlight);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .header a:hover { text-decoration: underline; }
    .target-info {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .target-info span { color: var(--text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .unit {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem 0.5rem;
      text-align: center;
    }
    .value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }
    .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
    }
    .footer {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .value { font-size: 1.85rem; }
    }
  </style>
</head>
<body>
  <main class="terminal">
    <div class="header">
      <h1>$ hpr-countdown --target 2026-12-31T10:00:00Z</h1>
      <a href="https://hackerpublicradio.org/" target="_blank" rel="noopener">hackerpublicradio.org ↗</a>
    </div>

    <div class="target-info">
      <div>Target (UTC): <span>2026-12-31 10:00:00 UTC</span></div>
      <div>Target (Local): <span id="local-target">Calculating...</span></div>
    </div>

    <div class="grid" id="countdown-grid">
      <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <div class="footer">
      <span id="status">STATUS: ACTIVE</span>
      <span>CC BY-SA / Hacker Public Radio</span>
    </div>
  </main>

  <script>
    const TARGET_MS = Date.UTC(2026, 11, 31, 10, 0, 0); // Month is 0-indexed (11 = Dec)
    const els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds'),
      status: document.getElementById('status'),
      localTarget: document.getElementById('local-target')
    };

    els.localTarget.textContent = new Date(TARGET_MS).toLocaleString(undefined, {
      dateStyle: 'medium',
      timeStyle: 'long'
    });

    const pad = (n) => String(n).padStart(2, '0');

    function tick() {
      const diff = TARGET_MS - Date.now();

      if (diff <= 0) {
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        els.status.textContent = 'STATUS: TARGET REACHED';
        els.status.style.color = '#3fb950';
        return;
      }

      const s = Math.floor(diff / 1000);
      els.days.textContent = pad(Math.floor(s / 86400));
      els.hours.textContent = pad(Math.floor((s % 86400) / 3600));
      els.minutes.textContent = pad(Math.floor((s % 3600) / 60));
      els.seconds.textContent = pad(s % 60);

      // Align next tick to the start of the next second to prevent drift
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }

    tick();
  </script>
</body>
</html>
